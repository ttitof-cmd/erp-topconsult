server.port=${PORT:8080}

# Base de datos PostgreSQL
# - En tu PC usa los valores por defecto (local).
# - En la nube (Render) se toman de las variables de entorno DB_URL, DB_USER, DB_PASS.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/topconsult_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

# Tamanos amplios para guardar archivos codificados
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Interfaz grafica (para abrir el navegador/bandeja en PC de escritorio)
